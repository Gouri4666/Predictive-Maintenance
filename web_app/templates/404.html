{% extends 'base.html' %}

{% block title %}Page Not Found{% endblock %}
{% block page_title %}Error 404{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-12 col-md-6 text-center">
        <div class="display-1 fw-bold text-muted mb-2">404</div>
        <h3 class="fw-bold mb-3">Telemetry Route Not Found</h3>
        <p class="text-secondary mb-4">The requested CNC monitoring page or resource does not exist or has been moved.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-industrial">
            <i class="bi bi-speedometer2 me-1"></i> Return to Main Dashboard
        </a>
    </div>
</div>
{% endblock %}
